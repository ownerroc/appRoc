name: Test secrets reach workflow

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - name: Print secret variable lengths
        env:
          KS_B64: ${{ secrets.APROC_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.APROC_KEYSTORE_PASSWORD }}
          KS_KS_ALIAS: ${{ secrets.APROC_KEYSTORE_ALIAS }}
          TEST_VAL: ${{ secrets.APROC_TEST_VALUE }}
          FRESH: ${{ secrets.APROC_FRESH_TEST }}
        run: |
          echo "len BASE64  = ${#KS_B64}"
          echo "len PASSWORD= ${#KS_PW}"
          echo "len ALIAS    = ${#KS_KS_ALIAS}"
          echo "len TESTVAL  = ${#TEST_VAL}"
          echo "len FRESH    = ${#FRESH}"
