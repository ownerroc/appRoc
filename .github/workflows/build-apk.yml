name: Build appRoc APK

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Ensure gradlew has LF line endings and is executable
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew scripts/*.sh docs/raw/en/doctool.sh

      - name: Decode release keystore from secrets
        env:
          APPROC_KEYSTORE_BASE64: ${{ secrets.APROC_KEYSTORE_BASE64 }}
        run: |
          echo "secret names visible to workflow: $(echo '${{ toJSON(secrets) }}' | tr -d ' ' | tr -d '\n' | grep -o '"[A-Z_]*"' | sort | tr '\n' ' ')"
          echo "keystore b64 text length: ${#APPROC_KEYSTORE_BASE64}"
          echo "$APPROC_KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
          echo "keystore bytes: $(wc -c < app/release-keystore.jks)"
          echo "keystore sha256: $(sha256sum app/release-keystore.jks | cut -d' ' -f1)"
          echo "magic bytes: $(head -c 4 app/release-keystore.jks | od -An -tx1 | tr -d ' ')"

      - name: Build release APK (signed with release keystore)
        env:
          APPROC_KEYSTORE_PASSWORD: ${{ secrets.APROC_KEYSTORE_PASSWORD }}
          APPROC_KEYSTORE_ALIAS: ${{ secrets.APROC_KEYSTORE_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Clean keystore from workspace
        run: rm -f app/release-keystore.jks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appRoc-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
